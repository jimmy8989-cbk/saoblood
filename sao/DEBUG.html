<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAO Debug Console</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
            overflow: auto;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #ffff00;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        
        h2 {
            color: #00ffff;
            margin-top: 20px;
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }
        
        .status.error {
            border-left-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            color: #ff6666;
        }
        
        .status.warning {
            border-left-color: #ffff00;
            background: rgba(255, 255, 0, 0.1);
            color: #ffff99;
        }
        
        .code {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            padding: 10px;
            margin: 10px 0;
            overflow-x: auto;
            border-radius: 4px;
        }
        
        .button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }
        
        .button:hover {
            background: #00dd00;
        }
        
        .check-mark {
            color: #00ff00;
        }
        
        .cross-mark {
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 SAO OS - DEBUG CONSOLE</h1>
        
        <h2>📋 Estado de Carga de Scripts</h2>
        <div id="script-status"></div>
        
        <h2>🌍 Variables Globales</h2>
        <div id="globals-status"></div>
        
        <h2>🔗 Dependencias</h2>
        <div id="dependencies-status"></div>
        
        <h2>🧪 Tests</h2>
        <button class="button" onclick="testFunctions()">Probar Funciones Globales</button>
        <button class="button" onclick="testWindow()">Inspeccionar Window</button>
        <button class="button" onclick="clearConsole()">Limpiar</button>
        
        <div id="test-results"></div>
    </div>

    <script>
        const results = {};
        
        function updateStatus(elementId, html) {
            document.getElementById(elementId).innerHTML += html;
        }
        
        function addStatusCheck(elementId, label, condition, details = '') {
            const status = condition ? '<span class="check-mark">✓</span>' : '<span class="cross-mark">✗</span>';
            const className = condition ? 'status' : 'status error';
            const html = `<div class="${className}">${status} ${label}${details ? ': ' + details : ''}</div>`;
            updateStatus(elementId, html);
            return condition;
        }
        
        function checkScripts() {
            updateStatus('script-status', '<div class="status">Revisando carga de scripts...</div>');
            
            const scripts = [
                { name: 'Tailwind Config', check: () => window.tailwind?.config !== undefined },
                { name: 'SAO Platform', check: () => window.SAOPlatform !== undefined },
                { name: 'SAO Config', check: () => window.SAO?.config !== undefined },
                { name: 'SAO Logger', check: () => window.SAO?.logger !== undefined },
                { name: 'SAO Architecture', check: () => window.SAO?.state !== undefined },
                { name: 'SAO Services', check: () => window.SAO?.firebase !== undefined },
                { name: 'SAO App', check: () => window.SAOApp !== undefined },
            ];
            
            scripts.forEach(script => {
                const status = script.check();
                const details = status ? 'Cargado ✓' : 'NO cargado ✗';
                addStatusCheck('script-status', script.name, status, details);
            });
        }
        
        function checkGlobals() {
            updateStatus('globals-status', '<div class="status">Variables globales detectadas:</div>');
            
            const globals = [
                'window.SAO',
                'window.SAOApp',
                'window.SAOPlatform',
                'window.SAOConfig',
                'window.firebaseModular',
                'window.tailwind',
            ];
            
            globals.forEach(globalVar => {
                const parts = globalVar.split('.');
                let obj = window;
                let exists = true;
                
                for (let part of parts.slice(1)) {
                    if (obj[part] === undefined) {
                        exists = false;
                        break;
                    }
                    obj = obj[part];
                }
                
                addStatusCheck('globals-status', globalVar, exists);
            });
        }
        
        function checkDependencies() {
            updateStatus('dependencies-status', '<div class="status">Verificando dependencias...</div>');
            
            const dependencies = [
                { name: 'Firebase Modular', check: () => window.firebaseModular?.app !== undefined },
                { name: 'Lucide Icons', check: () => window.lucide !== undefined },
                { name: 'State Manager', check: () => window.SAO?.state?.getState !== undefined },
                { name: 'Firebase Service', check: () => window.SAO?.firebase?.initialize !== undefined },
                { name: 'API Service', check: () => window.SAO?.api?.call !== undefined },
                { name: 'UI Manager', check: () => window.SAO?.ui?.render !== undefined },
            ];
            
            dependencies.forEach(dep => {
                const status = dep.check();
                addStatusCheck('dependencies-status', dep.name, status);
            });
        }
        
        function testFunctions() {
            let html = '<h3>Resultados de Tests:</h3>';
            
            // Test startNewChat
            if (typeof startNewChat === 'function') {
                html += '<div class="status">✓ startNewChat está disponible globalmente</div>';
            } else {
                html += '<div class="status error">✗ startNewChat NO está disponible</div>';
            }
            
            // Test handleSend
            if (typeof handleSend === 'function') {
                html += '<div class="status">✓ handleSend está disponible globalmente</div>';
            } else {
                html += '<div class="status error">✗ handleSend NO está disponible</div>';
            }
            
            // Test switchAuthTab
            if (typeof switchAuthTab === 'function') {
                html += '<div class="status">✓ switchAuthTab está disponible globalmente</div>';
            } else {
                html += '<div class="status error">✗ switchAuthTab NO está disponible</div>';
            }
            
            document.getElementById('test-results').innerHTML = html;
        }
        
        function testWindow() {
            let html = '<h3>Contenido de window.SAO:</h3>';
            
            if (window.SAO) {
                html += '<div class="code">' + JSON.stringify(
                    Object.keys(window.SAO).reduce((acc, key) => {
                        acc[key] = typeof window.SAO[key];
                        return acc;
                    }, {}),
                    null,
                    2
                ) + '</div>';
            } else {
                html += '<div class="status error">window.SAO no existe</div>';
            }
            
            html += '<h3>Contenido de window.SAOApp:</h3>';
            if (window.SAOApp) {
                html += '<div class="code">' + JSON.stringify(
                    Object.keys(window.SAOApp).reduce((acc, key) => {
                        acc[key] = typeof window.SAOApp[key];
                        return acc;
                    }, {}),
                    null,
                    2
                ) + '</div>';
            } else {
                html += '<div class="status error">window.SAOApp no existe</div>';
            }
            
            document.getElementById('test-results').innerHTML = html;
        }
        
        function clearConsole() {
            document.getElementById('test-results').innerHTML = '';
        }
        
        // Ejecutar checks al cargar
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkScripts();
                checkGlobals();
                checkDependencies();
            }, 500);
        });
    </script>
</body>
</html>
